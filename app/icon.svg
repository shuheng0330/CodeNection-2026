<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fulcrum node -->
  <circle cx="16" cy="6.8" r="1.8" fill="#8f3f24"/>

  <!-- Arched carrying yoke beam -->
