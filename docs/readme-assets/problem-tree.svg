<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Pikul problem tree</title>
  <desc id="desc">A problem tree showing causes of student overload below a core problem and consequences above it, connected to Pikul design decisions.</desc>
  <rect width="1600" height="1040" fill="#f8f3e8"/>
  <g font-family="Arial, sans-serif" fill="#23342c"><text x="800" y="58" text-anchor="middle" font-size="24" letter-spacing="3" fill="#8b614d">PROBLEM TREE</text><text x="800" y="94" text-anchor="middle" font-size="19" fill="#5d6d62">Why a request-time decision matters</text></g>
  <g fill="none" stroke="#b08b70" stroke-width="3" stroke-linecap="round"><path d="M800 462 L800 408 M800 322 L800 270 M800 802 L800 858"/><path d="M800 408 C650 385 488 360 300 300 M800 408 C950 385 1112 360 1300 300"/><path d="M800 858 C650 880 488 900 300 938 M800 858 C950 880 1112 900 1300 938"/></g>
  <g fill="#fffdf8" stroke="#d9c7b5" stroke-width="2"><rect x="85" y="148" width="430" height="155" rx="22"/><rect x="1085" y="148" width="430" height="155" rx="22"/><rect x="85" y="860" width="430" height="135" rx="22"/><rect x="1085" y="860" width="430" height="135" rx="22"/></g>
  <g font-family="Arial, sans-serif"><g font-size="21" font-weight="700" fill="#9a5738"><text x="118" y="190">CONSEQUENCES</text><text x="1118" y="190">CONSEQUENCES</text><text x="118" y="902">ROOT CAUSES</text><text x="1118" y="902">ROOT CAUSES</text></g><g font-size="20" fill="#405147"><text x="118" y="228">• overcommitment</text><text x="118" y="260">• last-minute reshuffling</text><text x="118" y="292">• less room for recovery</text><text x="1118" y="228">• difficult prioritisation</text><text x="1118" y="260">• harder to decline requests</text><text x="1118" y="292">• decisions made without context</text><text x="118" y="940">• overlapping deadlines</text><text x="118" y="972">• work, commute and family duties</text><text x="1118" y="940">• social pressure to say yes</text><text x="1118" y="972">• poor visibility of future load</text></g></g>
  <g><rect x="455" y="462" width="690" height="340" rx="40" fill="#28443a"/><text x="800" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" letter-spacing="2" fill="#e9b272">CORE PROBLEM</text><text x="800" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">One additional commitment can push</text><text x="800" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">an already-heavy week beyond a student’s</text><text x="800" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">own normal before they can see it.</text><line x1="555" y1="700" x2="1045" y2="700" stroke="#789082"/><text x="800" y="742" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#d7e3d7">Pikul responds with a personal baseline, a before/after preview,</text><text x="800" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#d7e3d7">and advisory choices to accept, decline, or make room.</text></g>
</svg>
